{% if form.errors %}
<div class="alert alert-danger" role="alert" tabindex="-1" id="resumo-erros">
  <h2 class="h6 mb-2">Corrija os itens abaixo antes de continuar:</h2>
  <ul class="mb-0">
    {% for campo in form %}{% for erro in campo.errors %}
      <li><a href="#{{ campo.id_for_label }}" class="alert-link">{{ campo.label }}</a>: {{ erro }}</li>
    {% endfor %}{% endfor %}
    {% for erro in form.non_field_errors %}<li>{{ erro }}</li>{% endfor %}
  </ul>
</div>
{% endif %}
