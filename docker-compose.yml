# PostgreSQL local para desenvolvimento: docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: equipes
      POSTGRES_USER: equipes
      POSTGRES_PASSWORD: equipes
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data

volumes:
  dados_postgres:
